<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Narumi - 日漫追番</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>
<body>
  <!-- 加载动画 -->
  <div id="loader" class="loader-screen">
    <div class="loader-content">
      <div class="loader-ring">
        <div class="loader-ring-inner"></div>
      </div>
      <div class="loader-text">NARUMI</div>
      <div class="loader-sub">正在加载中...</div>
    </div>
  </div>

  <!-- 顶部导航 -->
  <header id="navbar" class="navbar">
    <div class="navbar-inner">
      <a href="#/" class="nav-logo" id="navLogo">
        <span class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="url(#grad1)"/>
            <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="grad1" x1="2" y1="2" x2="22" y2="12">
                <stop offset="0%" stop-color="#00d4ff"/>
                <stop offset="100%" stop-color="#7b2ff7"/>
              </linearGradient>
              <linearGradient id="grad2" x1="2" y1="12" x2="22" y2="22">
                <stop offset="0%" stop-color="#00d4ff"/>
                <stop offset="100%" stop-color="#7b2ff7"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="logo-text">NARUMI</span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="#/" class="nav-link active" data-page="home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>首页</span>
        </a>
        <a href="#/seasonal" class="nav-link" data-page="seasonal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>新番</span>
        </a>
        <a href="#/trending" class="nav-link" data-page="trending">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>热门</span>
        </a>
        <a href="#/watchlist" class="nav-link" data-page="watchlist">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span>追番</span>
        </a>
      </nav>

      <div class="nav-actions">
        <button class="search-toggle" id="searchToggle" aria-label="搜索">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>

        <div class="user-menu" id="userMenu">
          <button class="user-avatar-btn" id="userAvatarBtn">
            <div class="avatar-placeholder" id="userAvatar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
          </button>
          <div class="user-dropdown" id="userDropdown">
            <div class="dropdown-arrow"></div>
            <div class="dropdown-content" id="dropdownContent">
              <!-- 动态渲染 -->
            </div>
          </div>
        </div>

        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- 搜索面板 -->
  <div class="search-panel" id="searchPanel">
    <div class="search-panel-inner">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索日漫番剧..." autocomplete="off" spellcheck="false">
        <kbd class="search-shortcut">ESC</kbd>
      </div>
      <div class="search-filters" id="searchFilters">
        <button class="filter-chip active" data-filter="tv">TV 动画</button>
        <button class="filter-chip" data-filter="movie">剧场版</button>
        <button class="filter-chip" data-filter="ova">OVA</button>
        <button class="filter-chip" data-filter="ona">ONA</button>
        <button class="filter-chip" data-filter="special">特别篇</button>
      </div>
      <div class="search-results" id="searchResults">
        <div class="search-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <p>输入关键词开始搜索</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 移动端菜单 -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-backdrop"></div>
    <div class="mobile-menu-content">
      <div class="mobile-menu-header">
        <span class="logo-text">NARUMI</span>
        <button class="mobile-menu-close" id="mobileMenuClose">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <nav class="mobile-nav-links" id="mobileNavLinks">
        <a href="#/" class="mobile-nav-link" data-page="home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          首页
        </a>
        <a href="#/seasonal" class="mobile-nav-link" data-page="seasonal">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
          新番
        </a>
        <a href="#/trending" class="mobile-nav-link" data-page="trending">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          热门
        </a>
        <a href="#/watchlist" class="mobile-nav-link" data-page="watchlist">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          追番
        </a>
      </nav>
    </div>
  </div>

  <!-- 主内容区 -->
  <main id="app" class="main-content"></main>

  <!-- 视频播放器覆盖层 -->
  <div class="player-overlay" id="playerOverlay">
    <div class="player-container">
      <div class="player-header">
        <button class="player-back" id="playerBack">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          返回
        </button>
        <div class="player-title" id="playerTitle"></div>
        <div class="player-episode-info" id="playerEpisodeInfo"></div>
      </div>
      <div class="player-video-wrapper">
        <div class="player-loading" id="playerLoading">
          <div class="loader-ring small">
            <div class="loader-ring-inner"></div>
          </div>
          <span>正在加载播放源...</span>
        </div>
        <iframe id="playerFrame" class="player-iframe" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" frameborder="0"></iframe>
      </div>
      <div class="player-episodes" id="playerEpisodes"></div>
    </div>
  </div>

  <!-- 登录/注册模态框 -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-backdrop" id="authBackdrop"></div>
    <div class="modal-container auth-modal">
      <button class="modal-close" id="authClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">登录</button>
        <button class="auth-tab" data-tab="register">注册</button>
        <div class="auth-tab-indicator"></div>
      </div>

      <!-- 登录表单 -->
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label>用户名 / 邮箱</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="loginUsername" placeholder="输入用户名或邮箱" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label>密码</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPassword" placeholder="输入密码" required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn-primary btn-full" id="loginBtn">
          <span>登录</span>
          <div class="btn-loader" style="display:none"></div>
        </button>
      </form>

      <!-- 注册表单 -->
      <form class="auth-form hidden" id="registerForm">
        <div class="form-group">
          <label>用户名</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="regUsername" placeholder="2-20个字符" required autocomplete="username" minlength="2" maxlength="20">
          </div>
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="regEmail" placeholder="your@email.com" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label>密码</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="regPassword" placeholder="至少6位" required autocomplete="new-password" minlength="6">
          </div>
        </div>
        <button type="submit" class="btn-primary btn-full" id="registerBtn">
          <span>注册</span>
          <div class="btn-loader" style="display:none"></div>
        </button>
      </form>

      <div class="auth-divider">
        <span>或者</span>
      </div>

      <a href="/api/auth/github" class="btn-github btn-full">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        使用 GitHub 登录
      </a>

      <div class="auth-error hidden" id="authError"></div>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 移动端底部导航 -->
  <nav class="bottom-nav" id="bottomNav">
    <a href="#/" class="bottom-nav-item active" data-page="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>首页</span>
    </a>
    <a href="#/seasonal" class="bottom-nav-item" data-page="seasonal">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
      <span>新番</span>
    </a>
    <a href="#/trending" class="bottom-nav-item" data-page="trending">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>热门</span>
    </a>
    <a href="#/watchlist" class="bottom-nav-item" data-page="watchlist">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>追番</span>
    </a>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
