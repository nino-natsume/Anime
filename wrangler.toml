name = "narumi"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "anime"
database_id = "3376fb80-46b7-4c40-b491-5831af0243fc"

# KV 命名空间
[[kv_namespaces]]
binding = "CACHE"
id = "7cdde8f6a1e745d7bd49f0e60007b5ff"

# 环境变量
[vars]
SITE_URL = "https://anime.107211.xyz"
GITHUB_CLIENT_ID = "Ov23liI5XAVEBI57CKut"
GITHUB_CLIENT_SECRET = "7948818920cb6fa3eff10e5097f898a5d40fe4c7"
JWT_SECRET = "0d000721"
# 流媒体源 API (consumet 风格 gogoanime); 支持多个上游, 用英文逗号分隔, 自动故障转移
# 免费公共源极不稳定, 若都失效, 前端会明确提示「流媒体源不可用」而非直接 404
STREAM_API_URL = "https://api.consumet.org/anime/gogoanime,https://anime-api.hanifz.com/anime/gogoanime"
