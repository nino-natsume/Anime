name = "narumi"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源
[site]
bucket = "./public"

# 环境变量 (非敏感, 可提交; 敏感值通过 GitHub Secrets 注入)
[vars]
SITE_URL = "https://anime.107211.xyz"

# 敏感配置通过 GitHub Actions 的 --var 注入, 不入库:
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   JWT_SECRET
#   STREAM_API_URL (可选)

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "anime"
database_id = ""  # 通过 GitHub Secret D1_DATABASE_ID 注入

# KV 命名空间绑定 (用于缓存)
[[kv_namespaces]]
binding = "CACHE"
id = ""  # 通过 GitHub Secret KV_NAMESPACE_ID 注入
