name = "narumi"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源
[site]
bucket = "./public"

# 环境变量 (非敏感, 可提交; 敏感值通过 GitHub Secrets 注入)
[vars]
SITE_URL = "https://anime.107211.xyz"

# D1 / KV 绑定在部署时通过命令行动态注入 (wrangler deploy --d1/--kv),
# 避免在配置文件里残留空的 database_id / id 导致解析报错。
