name: Update Deploy (快捷更新 · 无需输入)

# 快捷更新部署：与 deploy-manual.yml（初始部署）不同，
# 本工作流不要求每次手动输入 Secret —— 只需在仓库配置一次 Secret，
# 之后推送代码到 main 或手动点一下 "Run workflow" 即可直接部署上线。
#
# 配置一次（Settings → Secrets and variables → Actions → New repository secret）：
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare 账户 ID
#   CLOUDFLARE_API_TOKEN    Cloudflare API Token (部署权限)
#   D1_DATABASE_ID          D1 数据库 ID
#   KV_NAMESPACE_ID         KV 命名空间 ID
#   JWT_SECRET              JWT 签名密钥（与首次部署一致，否则旧 token 会失效）
#
# 可选（Repository variables，不配则用默认值/去掉该配置）：
#   SITE_URL                默认 https://anime.107211.xyz
#   STREAM_API_URL          流媒体源 (逗号分隔多源)
#   STREAM_ANIKOTO_URL      AniKoto 流媒体源
#
# 未配置 Secret 时运行会给出明确提示，不会产生脏部署。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署在跑，避免连续 push 互相覆盖
concurrency:
  group: deploy-update
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy latest code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查必填 Secrets 是否已配置
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=()
          for v in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN D1_DATABASE_ID KV_NAMESPACE_ID JWT_SECRET; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ 以下 Secret 未在仓库中配置: ${missing[*]}"
            echo ""
            echo "   请到 Settings → Secrets and variables → Actions → New repository secret 逐个添加："
            echo "     - CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN"
            echo "     - D1_DATABASE_ID / KV_NAMESPACE_ID / JWT_SECRET"
            echo ""
            echo "   首次部署可改用 deploy-manual.yml（Manual Deploy）在运行界面填写；"
            echo "   配置好这些 Secret 后，本工作流即可一键更新。"
            exit 1
          fi
          echo "✅ Secret 已配置完整，开始快捷部署"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build runtime config (Secret 注入 → 组装 wrangler.toml)
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://anime.107211.xyz' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STREAM_API_URL: ${{ vars.STREAM_API_URL }}
          STREAM_ANIKOTO_URL: ${{ vars.STREAM_ANIKOTO_URL }}
          TEMPLATE: wrangler.template.toml
          OUTPUT: wrangler.toml
        run: node scripts/build-config.js

      - name: Sync D1 Database (schema.sql, 幂等)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(grep -A1 '\[\[d1_databases\]\]' wrangler.toml | grep 'database_id' | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "Syncing D1 schema (db=$DB_ID)..."
          wrangler d1 execute "$DB_ID" --remote --file=schema.sql 2>&1 \
            || echo "DB already initialized, continuing..."

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=========================================="
          echo "  ✅ Deploy Complete!"
          echo "=========================================="
          echo "  Worker: narumi"
          echo "  Logs:   wrangler tail narumi"
          echo "=========================================="

      - name: Cleanup runtime secrets/config
        if: always()
        run: |
          rm -f wrangler.toml
          echo "已删除运行时生成的临时明文配置（Secret 随 job 结束销毁）"