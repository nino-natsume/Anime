name: Deploy Narumi to Cloudflare Workers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      # 注入 D1 / KV 资源 ID 到 wrangler.toml
      - name: Inject Resource IDs
        run: |
          D1_ID="${{ secrets.D1_DATABASE_ID }}"
          KV_ID="${{ secrets.KV_NAMESPACE_ID }}"

          if [ -n "$D1_ID" ]; then
            sed -i "s|database_id = \"\"|database_id = \"$D1_ID\"|" wrangler.toml
            echo "  ✅ D1 Database ID injected"
          else
            echo "  ⚠️  No D1_DATABASE_ID, skipping"
          fi

          if [ -n "$KV_ID" ]; then
            sed -i "s|id = \"\"|id = \"$KV_ID\"|" wrangler.toml
            echo "  ✅ KV Namespace ID injected"
          else
            echo "  ⚠️  No KV_NAMESPACE_ID, skipping"
          fi

      - name: Initialize D1 Database (if needed)
        if: ${{ secrets.D1_DATABASE_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Initializing D1 schema..."
          wrangler d1 execute anime --remote --file=schema.sql 2>&1 || echo "DB already initialized, continuing..."

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 通过 --var 注入敏感配置 (不写入 wrangler.toml, 不入代码库)
          EXTRA=""
          [ -n "${{ secrets.GITHUB_CLIENT_ID }}" ]     && EXTRA="$EXTRA --var GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}"
          [ -n "${{ secrets.GITHUB_CLIENT_SECRET }}" ] && EXTRA="$EXTRA --var GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}"
          [ -n "${{ secrets.JWT_SECRET }}" ]           && EXTRA="$EXTRA --var JWT_SECRET=${{ secrets.JWT_SECRET }}"
          [ -n "${{ secrets.STREAM_API_URL }}" ]       && EXTRA="$EXTRA --var STREAM_API_URL=${{ secrets.STREAM_API_URL }}"

          # 注意: 不要 echo $EXTRA, 避免泄露 GITHUB_CLIENT_SECRET 等敏感值到日志
          wrangler deploy $EXTRA

      - name: Verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=========================================="
          echo "  ✅ Deploy Complete!"
          echo "=========================================="
          echo "  Worker: narumi"
          echo "  Logs:   wrangler tail narumi"
          echo "=========================================="
