name: Deploy Narumi to Cloudflare Workers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build runtime config (随机密钥双重加密用户 secret + 组装 wrangler.toml)
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STREAM_API_URL: ${{ secrets.STREAM_API_URL }}
          STREAM_ANIKOTO_URL: ${{ secrets.STREAM_ANIKOTO_URL }}
          TEMPLATE: wrangler.template.toml
          OUTPUT: wrangler.toml
        run: node scripts/build-config.js

      - name: Initialize D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(grep -A1 '\[\[d1_databases\]\]' wrangler.toml | grep 'database_id' | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "Initializing D1 schema (db=$DB_ID)..."
          wrangler d1 execute "$DB_ID" --remote --file=schema.sql 2>&1 \
            || echo "DB already initialized, continuing..."

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=========================================="
          echo "  ✅ Deploy Complete!"
          echo "=========================================="
          echo "  Worker: narumi"
          echo "  Logs:   wrangler tail narumi"
          echo "=========================================="

      - name: Cleanup runtime secrets/config
        if: always()
        run: |
          rm -f wrangler.toml
          echo "已删除运行时生成的临时明文配置（随机密钥随 job 结束销毁）"