name: Deploy Narumi to Cloudflare Workers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify Required Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.D1_DATABASE_ID }}" ]        && MISSING="$MISSING D1_DATABASE_ID"
          [ -z "${{ secrets.KV_NAMESPACE_ID }}" ]       && MISSING="$MISSING KV_NAMESPACE_ID"
          [ -z "${{ secrets.GITHUB_CLIENT_ID }}" ]      && MISSING="$MISSING GITHUB_CLIENT_ID"
          [ -z "${{ secrets.GITHUB_CLIENT_SECRET }}" ]  && MISSING="$MISSING GITHUB_CLIENT_SECRET"
          [ -z "${{ secrets.JWT_SECRET }}" ]            && MISSING="$MISSING JWT_SECRET"

          if [ -n "$MISSING" ]; then
            echo "❌ 缺少以下 GitHub Secrets:${MISSING}"
            echo ""
            echo "请在仓库 Settings → Secrets and variables → Actions 添加后重试:"
            for s in $MISSING; do echo "   - $s"; done
            exit 1
          fi
          echo "✅ 所有必需的 GitHub Secrets 已配置"

      - name: Initialize D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D1_ID="${{ secrets.D1_DATABASE_ID }}"
          if [ -z "$D1_ID" ]; then
            echo "⚠️  未配置 D1_DATABASE_ID, 跳过数据库初始化"
            exit 0
          fi
          echo "Initializing D1 schema..."
          wrangler d1 execute "$D1_ID" --remote --file=schema.sql 2>&1 \
            || echo "DB already initialized, continuing..."

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D1_ID="${{ secrets.D1_DATABASE_ID }}"
          KV_ID="${{ secrets.KV_NAMESPACE_ID }}"

          # 组装绑定 + 环境变量 (敏感值用 --var 动态注入, 不入代码库)
          ARGS=""

          if [ -n "$D1_ID" ]; then
            ARGS="$ARGS --d1 DB=$D1_ID"
          else
            echo "⚠️  未配置 D1_DATABASE_ID, 不绑定 D1"
          fi

          if [ -n "$KV_ID" ]; then
            ARGS="$ARGS --kv CACHE=$KV_ID"
          else
            echo "⚠️  未配置 KV_NAMESPACE_ID, 不绑定 KV"
          fi

          [ -n "${{ secrets.GITHUB_CLIENT_ID }}" ]     && ARGS="$ARGS --var GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}"
          [ -n "${{ secrets.GITHUB_CLIENT_SECRET }}" ] && ARGS="$ARGS --var GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}"
          [ -n "${{ secrets.JWT_SECRET }}" ]           && ARGS="$ARGS --var JWT_SECRET=${{ secrets.JWT_SECRET }}"
          [ -n "${{ secrets.STREAM_API_URL }}" ]       && ARGS="$ARGS --var STREAM_API_URL=${{ secrets.STREAM_API_URL }}"

          # 注意: 请勿 echo $ARGS, 避免泄露 GITHUB_CLIENT_SECRET 等敏感值
          wrangler deploy $ARGS

      - name: Verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=========================================="
          echo "  ✅ Deploy Complete!"
          echo "=========================================="
          echo "  Worker: narumi"
          echo "  Logs:   wrangler tail narumi"
          echo "=========================================="
