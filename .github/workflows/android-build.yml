# ═══════════════════════════════════════════════════════════
#  Narumi Android APK 自动构建 (GitHub Actions)
#  Push main / 手动触发 / 发布 Release 时, 自动编译并上传 APK
#  APK 默认 Debug 签名, 可直接安装到手机
# ═══════════════════════════════════════════════════════════
name: Build Narumi APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 34 + build-tools)
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK (可安装)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Narumi-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      # 发布 Release 时把 APK 挂到 Release 附件
      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk

      - name: Summary
        run: |
          echo "=========================================="
          echo "  ✅ APK Build Complete!"
          echo "=========================================="
          echo "  Artifact: Narumi-Debug-APK"
          echo "  下载: Actions → 本次运行 → Artifacts"
          echo "=========================================="