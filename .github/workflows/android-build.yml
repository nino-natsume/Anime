# ═══════════════════════════════════════════════════════════
#  Narumi Android APK 自动构建 (GitHub Actions)
#  Push main / 手动触发 / 发布 Release 时, 自动编译并上传 APK
#  APK 默认 Debug 签名, 可直接安装到手机
# ═══════════════════════════════════════════════════════════
name: Build Narumi APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 自包含 SDK 安装: 不依赖第三方 action, 全程可控
      - name: Set up Android SDK (cmdline-tools)
        run: |
          set -e
          SDK_DIR="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licenses + Install SDK packages
        run: |
          set -e
          # 手动写入 license hash (比 yes|sdkmanager --licenses 可靠)
          mkdir -p "$ANDROID_HOME/licenses"
          cat > "$ANDROID_HOME/licenses/android-sdk-license" <<'EOF'
8933bad161af4178b1185d1a37fbf41ea5269c55
d56f5187479451eabf01fb78af6dfcb131a6481e
24333f8a63b6825ea9c5514f83c2829b004d1fee
EOF
          cat > "$ANDROID_HOME/licenses/android-sdk-preview-license" <<'EOF'
84831b9409646a918e30573bab4c9c91346d8abd
EOF
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "--- licenses dir ---"
          ls "$ANDROID_HOME/licenses/" 2>/dev/null || echo "NO licenses dir!"
          echo "--- sdk content ---"
          ls "$ANDROID_HOME"

      - name: Set up Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # 构建 + 完整日志 (失败也上传, 便于定位)
      - name: Build Debug APK (可安装)
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          echo "=== java ==="; java -version 2>&1 | head -2
          echo "=== gradle ==="; gradle --version | head -6
          echo "=== local.properties ==="; cat local.properties
          echo "=== assembleDebug ==="
          gradle assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Narumi-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 发布 Release 时把 APK 挂到 Release 附件
      - name: Attach APK to Release
        if: github.event_name == 'release' && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk

      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed. Log tail:"
          tail -80 /tmp/build.log | sed 's/\(.*\)/::error::LOG: \1/'
          exit 1

      - name: Summary
        if: steps.build.outcome == 'success'
        run: |
          echo "=========================================="
          echo "  ✅ APK Build Complete!"
          echo "=========================================="
          echo "  Artifact: Narumi-Debug-APK"
          echo "  下载: Actions → 本次运行 → Artifacts"
          echo "=========================================="