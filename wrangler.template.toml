# Narumi wrangler 配置模板（不含任何机密，可安全入库）
# 部署时由 GitHub Actions 使用 secrets 实时填充占位符并生成临时 wrangler.toml
# 占位符语法: {{ENV_NAME}}  -> 从对应环境变量注入

name = "narumi"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "anime"
database_id = "{{D1_DATABASE_ID}}"

# KV 命名空间
[[kv_namespaces]]
binding = "CACHE"
id = "{{KV_NAMESPACE_ID}}"

# 环境变量
[vars]
SITE_URL = "{{SITE_URL}}"
CLIENT_ID = "{{CLIENT_ID}}"
CLIENT_SECRET = "{{CLIENT_SECRET}}"
JWT_SECRET = "{{JWT_SECRET}}"
# 流媒体源 API (consumet 风格 gogoanime); 支持多个上游, 用英文逗号分隔, 自动故障转移
# 免费公共源极不稳定, 若都失效, 前端会明确提示「流媒体源不可用」而非直接 404
STREAM_API_URL = "{{STREAM_API_URL}}"
# AniKotoAPI 专属流媒体源 (用户自部署); 配置后 worker 会优先走 AniKoto 取源链路
STREAM_ANIKOTO_URL = "{{STREAM_ANIKOTO_URL}}"